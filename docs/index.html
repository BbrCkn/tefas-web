<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omurga - CORE ADAY TAKIP YEDEK</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
*{font-family: Inter, system-ui, sans-serif}
.mono{font-family:"JetBrains Mono", monospace}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:3px}
</style>

<body class="bg-[#08080a] text-zinc-100 min-h-screen">
<div id="root"></div>
<script type="text/babel">
const Ku = "omurga_excel_cache_v6_v18";
function re(e){if(e==null||e==="")return 0; if(typeof e==="number")return e; let n=String(e).trim(); if(!n) return 0; n=n.replace(/\s/g,"").replace(/₺/g,"").replace(/%/g,""); let neg=n.startsWith("(")&&n.endsWith(")"); if(neg) n=n.slice(1,-1); if(n.includes(",")&&n.includes(".")){ if(n.lastIndexOf(",")>n.lastIndexOf(".")){ n=n.replace(/\./g,"").replace(",","."); } else { n=n.replace(/,/g,""); } } else if(n.includes(",")){ if(/,\d{3}$/.test(n)){ n=n.replace(/,/g,""); } else { n=n.replace(",","."); } } let v=parseFloat(n); if(isNaN(v)) return 0; return neg?-v:v; }
function Eh(e){if(e==null||e===void 0||e==="")return 2; let n=String(e).trim().toUpperCase(),t=n.match(/([0-3])/); if(t) return parseInt(t[1]); return 2; }
function cl(e){if(e==null||e===void 0||isNaN(e)) return "0.0"; return Number(e).toFixed(1); }
function lp(e){ return new Intl.NumberFormat('tr-TR',{minimumFractionDigits:1, maximumFractionDigits:1}).format(e); }
function timeAgo(ts){
  if(!ts) return "—";
  let diff=Date.now()-ts;
  if(diff<60000) return `Son Güncelleme ${Math.floor(diff/1000)} sn önce`;
  if(diff<3600000) return `Son Güncelleme ${Math.floor(diff/60000)} dk önce`;
  if(diff<86400000) return `Son Güncelleme ${Math.floor(diff/3600000)} saat önce`;
  let d=new Date(ts);
  return `Son Güncelleme ${d.toLocaleDateString('tr-TR')} ${d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}`;
}

function App(){
  const [funds,setFunds]=React.useState([]);
  const [portfolio,setPortfolio]=React.useState([]);
  const [search,setSearch]=React.useState("");
  const [editMode,setEditMode]=React.useState(false);
  const [titles,setTitles]=React.useState({gunluk:"CORE",haftalik:"ADAY",aylik:"TAKIP",yedekHavuz:"YEDEK"});
  const [totals,setTotals]=React.useState({monthly:0, yearly:0, daily:0});
  const [lastUpdate,setLastUpdate]=React.useState(null);
  const [tableDate,setTableDate]=React.useState(null);
  const [isGunuSayilari,setIsGunuSayilari]=React.useState(null);
  const [toast,setToast]=React.useState("");
  const fileRef=React.useRef(null);
  const portfolioRef=React.useRef(null);
  const showToast=(m)=>{setToast(m); setTimeout(()=>setToast(""),3000)};

  const loadXLSX=async()=>{
    if(window.XLSX) return window.XLSX;
    return await new Promise((res,rej)=>{
      let s=document.createElement("script");
      s.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
      s.onload=()=>res(window.XLSX);
      s.onerror=()=>rej();
      document.body.appendChild(s);
    });
  };

  const parseExcel=async(buffer,name)=>{
    let XLSX=await loadXLSX();
    let wb=XLSX.read(buffer,{type:"array"});
    let sheetName=wb.SheetNames.includes("Veri")?"Veri":wb.SheetNames[0];
    let ws=wb.Sheets[sheetName];
    let raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
    let fmt=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:false});

    let headerRow=1;
    for(let i=0;i<6;i++){ let r=fmt[i]; if(!r) continue; let j=r.join(" ").toUpperCase(); if(j.includes("VAL")&&j.includes("RNK")){headerRow=i;break;} }
    let startRow=headerRow+2;

    let dailyTotal=0, monthlyTotal=0, yearlyTotal=0;
    let tableDateRaw=null;
    try{
      dailyTotal = re(raw[1]?.[6] ?? fmt[1]?.[6]);
      monthlyTotal = re(raw[3]?.[18] ?? fmt[3]?.[18]);
      yearlyTotal = re(raw[3]?.[23] ?? fmt[3]?.[23]);
      if(monthlyTotal===0) monthlyTotal = re(raw[2]?.[18]);
      if(yearlyTotal===0) yearlyTotal = re(raw[2]?.[23]);
      if(dailyTotal===0) dailyTotal = re(raw[3]?.[6]);
      // B3 - tablo tarihi (Veri sayfası B3)
      tableDateRaw = raw[2]?.[1] ?? fmt[2]?.[1];
    }catch(e){}

    // B3 tarihini Date'e çevir
    let parsedTableDate=null;
    try{
      if(tableDateRaw!=null){
        if(typeof tableDateRaw==="number"){
          // Excel serial date
          let utc_days = Math.floor(tableDateRaw - 25569);
          let utc_value = utc_days * 86400;
          let date_info = new Date(utc_value * 1000);
          // fractional day for time
          let fractional_day = tableDateRaw - Math.floor(tableDateRaw);
          let total_seconds = Math.floor(86400 * fractional_day);
          date_info.setSeconds(date_info.getSeconds()+total_seconds);
          // Excel dates are in local, adjust
          parsedTableDate = new Date(date_info.getUTCFullYear(), date_info.getUTCMonth(), date_info.getUTCDate());
          // if year < 2000, likely invalid
          if(parsedTableDate.getFullYear()<2000) parsedTableDate=null;
        } else {
          let s=String(tableDateRaw).trim();
          // try parse dd.mm.yyyy or dd/mm/yyyy etc
          let d=null;
          // if contains . or /
          let m=s.match(/(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);
          if(m){
            d=new Date(parseInt(m[3]), parseInt(m[2])-1, parseInt(m[1]));
          } else {
            let tmp=new Date(s);
            if(!isNaN(tmp)) d=tmp;
          }
          if(d && !isNaN(d)) parsedTableDate=d;
        }
      }
    }catch(e){}
    if(parsedTableDate) setTableDate(parsedTableDate.getTime());
    else if(tableDateRaw) {
      // fallback string olarak sakla
      setTableDate(String(tableDateRaw));
    }

    let list=[];
    for(let r=startRow;r<raw.length;r++){
      let rowRaw=raw[r]||[];
      let rowFmt=fmt[r]||[];
      let kodRaw=rowRaw[0]??rowFmt[0];
      if(!kodRaw) continue;
      let kod=String(kodRaw).trim().toUpperCase();
      if(kod.length<2||kod.length>6) continue;
      if(kod.includes("TOPLAM")||kod.includes("ORT")) continue;
      let ad=String(rowFmt[1]??rowRaw[1]??kod).trim();
      let val=Eh(rowRaw[2]??rowFmt[2]);
      let rnk=parseInt(rowRaw[3]??rowFmt[3])||r+1;
      let dunRnkRaw=rowRaw[26]??rowFmt[26];
      let dunRnk=typeof dunRnkRaw==="number"?dunRnkRaw:re(dunRnkRaw);
      let isBold=false;
      if(dunRnk&&rnk) isBold = rnk <= dunRnk;
      let gunlukTL = re(rowFmt[6]??rowRaw[6]);
      let gun = re(rowRaw[29]??rowFmt[29]);
      let haf = re(rowRaw[30]??rowFmt[30]);
      let ay = re(rowRaw[31]??rowFmt[31]);
      let ay3 = re(rowRaw[32]??rowFmt[32]);
      let ay6 = re(rowRaw[33]??rowFmt[33]);
      let yil = re(rowRaw[34]??rowFmt[34]);
      let guncel = re(rowFmt[5]??rowRaw[5]);
      let toplam = re(rowFmt[23]??rowRaw[23]);
      list.push({kod,ad,val,rnk,dunRnk,isBold,gun,haf,ay,ay3,ay6,yil,guncel,toplam,gunlukTL});
    }

    list.sort((a,b)=>a.rnk-b.rnk);
    let ts=Date.now();
    setFunds(list);
    let withBalance=list.filter(f=>f.guncel>0);
    setPortfolio(withBalance.length?withBalance:[]);
    setTotals({daily:dailyTotal, monthly:monthlyTotal, yearly:yearlyTotal});
    setLastUpdate(ts);
    showToast(`${list.length} fon yüklendi`);

    try{
      let cache={name, funds:list, portfolio:withBalance, totals:{daily:dailyTotal, monthly:monthlyTotal, yearly:yearlyTotal}, timestamp:ts, tableDate: tableDateRaw!=null ? (parsedTableDate? parsedTableDate.getTime() : String(tableDateRaw)) : null};
      localStorage.setItem(Ku, JSON.stringify(cache));
      // clear old caches
      localStorage.removeItem("omurga_excel_cache_v5_DleAA");
      localStorage.removeItem("omurga_excel_cache_v4_TLfix");
    }catch(e){}
  };

  React.useEffect(()=>{
    // 1) Once oncelikli: otomatik uretilen data.json'i cek (gunluk pipeline'in ciktisi)
    fetch('./data.json', {cache:'no-store'})
      .then(r=> r.ok ? r.json() : Promise.reject())
      .then(o=>{
        if(o.funds && o.funds.length){
          setFunds(o.funds);
          setPortfolio(o.portfolio||[]);
          if(o.totals) setTotals(o.totals);
          if(o.timestamp) setLastUpdate(o.timestamp);
          if(o.tableDate!=null) setTableDate(o.tableDate);
          if(o.isGunuSayilari) setIsGunuSayilari(o.isGunuSayilari);
          try{ localStorage.setItem(Ku, JSON.stringify(o)); }catch(e){}
          showToast(`${o.funds.length} fon yuklendi (otomatik)`);
        } else {
          throw new Error('bos data.json');
        }
      })
      .catch(()=>{
        // 2) data.json yoksa/erisilemezse eski davranis: tarayici hafizasindan yukle
        try{
          let keys=[Ku,"omurga_excel_cache_v5_DleAA","omurga_excel_cache_v4_TLfix","omurga_excel_cache_v3_F"];
          for(let k of keys){
            let c=localStorage.getItem(k);
            if(c){ let o=JSON.parse(c); if(o.funds && o.funds.length){ setFunds(o.funds); setPortfolio(o.portfolio||[]); if(o.totals) setTotals(o.totals); if(o.timestamp) setLastUpdate(o.timestamp); if(o.tableDate!=null) setTableDate(o.tableDate); break; } }
          }
        }catch(e){}
      });
  },[]);

  const filtered=React.useMemo(()=>{
    let m=funds;
    if(search){ let q=search.toLowerCase(); m=m.filter(f=>f.kod.toLowerCase().includes(q)||f.ad.toLowerCase().includes(q)); }
    return m;
  },[funds,search]);

  const groups=React.useMemo(()=>{
    let sorted=[...filtered].sort((a,b)=>a.rnk-b.rnk);
    return {
      gunluk: sorted.slice(0,25),
      haftalik: sorted.slice(25,50),
      aylik: sorted.slice(50,75),
      yedekHavuz: sorted.slice(75,100),
    };
  },[filtered]);

  const avg=(arr)=> arr.length? arr.reduce((s,f)=>s+f.yil,0)/arr.length : 0;
  const handleFile=(file)=>{ file.arrayBuffer().then(buf=>parseExcel(buf,file.name)); };
  const scrollToPortfolio=()=>{ portfolioRef.current?.scrollIntoView({behavior:"smooth"}); };

  const formatTableDate=React.useMemo(()=>{
    if(!tableDate) return "";
    try{
      let d=null;
      if(typeof tableDate==="number"){
        d=new Date(tableDate);
      } else if(typeof tableDate==="string"){
        // eğer zaten formatlı string ise direkt göster
        // tarih parse edilebiliyorsa formatla
        let tmp=new Date(tableDate);
        if(!isNaN(tmp) && tmp.getFullYear()>2000){
          d=tmp;
        } else {
          return tableDate;
        }
      }
      if(!d || isNaN(d)) return "";
      return new Intl.DateTimeFormat('tr-TR',{day:'numeric', month:'long', year:'numeric', weekday:'long'}).format(d);
    }catch(e){ return typeof tableDate==="string"? tableDate : ""; }
  },[tableDate]);

  // V16 font sizes: title 14px bold, badge 10px, header 10px uppercase, rows 11px mono
  // Grid template for perfect alignment: FON(46px) AD(1fr genişletilmiş) VALÖR(40px) SIRA(42px) GÜN(52px) HAF(52px) AY(52px) 3AY(52px) 6AY(52px) YIL(52px)
  // This matches v16: [46px_1fr_40px_42px_58px_58px] but extended to 10 cols, keeping AD geniş

  return (
    <div className="min-h-screen">
      <header className="sticky top-0 z-20 backdrop-blur-xl bg-[#08080a]/90 border-b border-zinc-800">
        <div className="mx-auto max-w-[1680px] px-5 py-4 flex flex-col lg:flex-row gap-4 justify-between">
          <div className="flex flex-col">
            <h1 className="text-[28px] md:text-3xl font-bold tracking-tight leading-none flex items-center gap-3">
              <span className="inline-flex h-9 w-9 items-center justify-center rounded-xl bg-white border border-zinc-200 shadow-sm overflow-hidden p-1">

                <div className="text-center pl-2">VALÖR</div>

                <div className="text-right">GÜN</div>
                <div className="text-right">HAF</div>

                  <div className={`truncate pr-3 text-[11px] ${isPPF?"text-emerald-300":"text-zinc-100"}`} title={f.ad}>{f.ad}</div>
                  <div className="text-right mono text-[11px] font-medium text-zinc-200 pr-6">{lp(f.guncel)}</div>
                  <div className="flex justify-center pl-2"><span className="bg-zinc-800 text-zinc-300 border border-zinc-700 rounded-md px-2 py-0.5 text-[11px] font-medium mono min-w-[26px] justify-center inline-flex">{f.val}</span></div>
                  <div className="flex justify-center"><span className="border rounded-md px-2 py-0.5 text-[11px] font-medium mono min-w-[28px] justify-center inline-flex bg-zinc-800/50 text-zinc-300 border-zinc-700/60">{f.rnk}</span></div>

                  <div className={`text-right mono text-[11px] font-medium ${f.ay>=0?"text-emerald-400":"text-red-400"}`}>{cl(f.ay)}</div>
                  <div className={`text-right mono text-[11px] font-medium ${f.ay3>=0?"text-emerald-400":"text-red-400"}`}>{cl(f.ay3)}</div>
                  <div className={`text-right mono text-[11px] font-medium ${f.ay6>=0?"text-emerald-400":"text-red-400"}`}>{cl(f.ay6)}</div>
                  <div className={`text-right mono text-[11px] font-medium ${f.yil>=0?"text-emerald-400":"text-red-400"}`}>{cl(f.yil)}</div>
                  <div className="text-right mono text-[11px] font-medium text-violet-300">{lp(f.gunlukTL)}</div>
                </div>
              )})}

                  <div></div>

  );
}

function GroupCard({title,funds,avgYil,color,editMode,onTitleChange}){
  const colorMap={
    indigo:"border-indigo-500/30 from-indigo-500/[0.08] bg-indigo-500/70 badge-indigo",
    blue:"border-blue-500/30 from-blue-500/[0.08] bg-blue-500/70",
    amber:"border-amber-500/30 from-amber-500/[0.08] bg-amber-500/70",
    slate:"border-zinc-600/30 from-zinc-500/[0.08] bg-zinc-500/60"
  };
  const badgeClass = color==="indigo" ? "bg-indigo-500/15 text-indigo-200 border-indigo-500/20" : color==="blue" ? "bg-blue-500/15 text-blue-200 border-blue-500/20" : color==="amber" ? "bg-amber-500/15 text-amber-200 border-amber-500/20" : "bg-zinc-800 text-zinc-300 border-zinc-700";
  const lineClass = color==="indigo" ? "bg-indigo-500/70" : color==="blue" ? "bg-blue-500/70" : color==="amber" ? "bg-amber-500/70" : "bg-zinc-500/60";
  const borderClass = color==="indigo" ? "border-indigo-500/30" : color==="blue" ? "border-blue-500/30" : color==="amber" ? "border-amber-500/30" : "border-zinc-600/30";
  const bgGrad = color==="indigo" ? "from-indigo-500/[0.08] to-transparent" : color==="blue" ? "from-blue-500/[0.08] to-transparent" : color==="amber" ? "from-amber-500/[0.08] to-transparent" : "from-zinc-500/[0.08] to-transparent";

  return (
    <div className="flex flex-col gap-3">
      <div className={`rounded-[20px] border ${borderClass} bg-[#121216] bg-gradient-to-br ${bgGrad} p-5 backdrop-blur shadow-[0_0_0_1px_rgba(255,255,255,0.02)_inset] relative overflow-hidden`}>
        <div className={`absolute top-0 left-5 right-5 h-[1px] bg-gradient-to-r ${color==="indigo"?"from-indigo-500/50 to-transparent":color==="blue"?"from-blue-500/50 to-transparent":color==="amber"?"from-amber-500/50 to-transparent":"from-zinc-500/30 to-transparent"}`}></div>
        <div className="flex items-start justify-between">
          <div className="flex-1">
            {editMode ? <input value={title} onChange={e=>onTitleChange(e.target.value)} className="bg-zinc-900 border border-zinc-700 rounded-lg px-2.5 py-1 text-[12px] font-bold tracking-widest outline-none focus:border-violet-500 w-[160px] uppercase"/> : <span className="text-[14px] font-bold tracking-[0.14em] text-slate-200 uppercase">{title.toUpperCase()}</span>}
            <div className="mt-3 flex items-center gap-2">
              <div className={`inline-flex items-center px-2.5 py-1 rounded-full border text-[10px] mono font-medium ${badgeClass}`}>Ort 1Y: {avgYil.toFixed(1)}%</div>
            </div>
          </div>
        </div>
        <div className="mt-4 flex items-center gap-2">
          <div className={`h-[2px] w-[34%] rounded-full ${lineClass}`}></div>
          <div className="h-[2px] flex-1 rounded-full bg-zinc-800/60"></div>
        </div>
      </div>

      <div className="rounded-[22px] border border-zinc-800 bg-[#101014] overflow-hidden flex flex-col shadow-sm">
        {/* Portföy ile aynı mantık: tek scroll container, header sticky, aynı grid, ip gibi hizalı */}
        <div className="overflow-auto max-h-[560px] xl:max-h-[620px]">
          <div className="min-w-[680px]">
            <div className="grid grid-cols-[46px_1fr_40px_42px_52px_52px_52px_52px_52px_52px] gap-0 px-4 py-3 text-[10px] uppercase tracking-wider text-slate-300 border-b border-zinc-800/60 bg-[#101014] sticky top-0 z-10">
              <div className="text-left font-medium">FON</div>
              <div className="text-left font-medium pr-3">AD</div>
              <div className="text-center font-medium">VALÖR</div>
              <div className="text-center font-medium">SIRA</div>
              <div className="text-right font-medium pr-1">GÜN</div>
              <div className="text-right font-medium pr-1">HAF</div>
              <div className="text-right font-medium pr-1">AY</div>
              <div className="text-right font-medium pr-1">3AY</div>
              <div className="text-right font-medium pr-1">6AY</div>
              <div className="text-right font-medium">YIL</div>
            </div>
            <div className="divide-y divide-zinc-800/30">
              {funds.map(f=>(
                <div key={f.kod} className="grid grid-cols-[46px_1fr_40px_42px_52px_52px_52px_52px_52px_52px] gap-0 items-center px-4 py-2.5 hover:bg-zinc-900/60 transition">
                  <div className={`mono text-[11px] tracking-tight truncate ${f.isBold?"text-amber-200 font-bold":"text-zinc-300 font-medium"}`}>{f.kod}</div>
                  <div className="text-[11px] truncate pr-3 text-zinc-300" title={f.ad}>{f.ad}</div>
                  <div className="flex justify-center"><span className="bg-slate-800 text-slate-300 border border-slate-700 rounded-md px-2 py-0.5 text-[11px] font-medium mono min-w-[26px] justify-center inline-flex">{f.val}</span></div>
                  <div className="flex justify-center"><span className={`border rounded-md px-2 py-0.5 text-[11px] font-medium mono min-w-[28px] justify-center inline-flex ${f.isBold?"bg-amber-500/20 text-amber-300 border-amber-400/30 font-bold":"bg-slate-800/50 text-slate-400 border-slate-700/60"}`}>{f.rnk}</span></div>
                  <div className={`text-right mono text-[11px] font-medium pr-1 ${f.gun>=0?"text-emerald-400":"text-red-400"}`}>{cl(f.gun)}</div>
                  <div className={`text-right mono text-[11px] font-medium pr-1 ${f.haf>=0?"text-emerald-400":"text-red-400"}`}>{cl(f.haf)}</div>
                  <div className={`text-right mono text-[11px] font-medium pr-1 ${f.ay>=0?"text-emerald-400":"text-red-400"}`}>{cl(f.ay)}</div>
                  <div className={`text-right mono text-[11px] font-medium pr-1 ${f.ay3>=0?"text-emerald-400":"text-red-400"}`}>{cl(f.ay3)}</div>
                  <div className={`text-right mono text-[11px] font-medium pr-1 ${f.ay6>=0?"text-emerald-400":"text-red-400"}`}>{cl(f.ay6)}</div>
                  <div className={`text-right mono text-[11px] font-medium ${f.yil>=0?"text-emerald-400":"text-red-400"}`}>{cl(f.yil)}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
