name: DE Walk-Forward Test
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Paketleri kur
        run: pip install numpy scipy pandas
      - name: Testi calistir
        working-directory: de_walkforward_test
        run: python3 -u de_walkforward_standalone.py --train 150 --test 45 --n-windows 5 --window-step 20
      - name: Sonuclari yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: de-walkforward-sonuclar
          path: |
            de_walkforward_test/de_wf_full_log.txt
            de_walkforward_test/de_wf_full_checkpoint.pkl
