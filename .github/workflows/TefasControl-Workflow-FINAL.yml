name: TefasControl

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checker pytefas ile
        run: |
          cat > checker.py << 'PYEOF'
          import openpyxl
          import sys
          try:
              from pytefas import Crawler
          except ImportError:
              print("pytefas yok, yukleniyor...")
              import subprocess
              subprocess.check_call([sys.executable, "-m", "pip", "install", "pytefas"])
              from pytefas import Crawler

          INPUT_FILE = "giris.xlsx"
          SHEET_NAME = "Tablo Verisi"
          OUTPUT_FILE = "TefasControl_Sonuc_FINAL.xlsx"
          START_ROW = 6
          END_ROW = 558

          def main():
              wb = openpyxl.load_workbook(INPUT_FILE)
              ws = wb[SHEET_NAME]
              kodlar = [str(ws.cell(r, 1).value).strip().upper() for r in range(START_ROW, END_ROW+1) if ws.cell(r, 1).value]
              print(f"Excelden {len(kodlar)} kod")
              
              # pytefas ile tum fonlari cek
              try:
                  crawler = Crawler()
                  # Bugunun tarihini kullan
                  import datetime
                  today = datetime.date.today().strftime("%Y-%m-%d")
                  print(f"pytefas fetch {today}")
                  # tum YAT fonlarini cek
                  df = crawler.fetch(start_date=today, columns="info", kind="YAT")
                  print(f"pytefas {len(df)} kayit dondu")
                  print(df.head())
                  # df icinde fon kodu sutunu var mi?
                  # olasi kolonlar: kod, FonKodu, etc
                  tefas_set = set()
                  for col in df.columns:
                      if "kod" in col.lower():
                          tefas_set.update([str(x).strip().upper() for x in df[col].dropna().tolist()])
                  print(f"TEFAS set {len(tefas_set)}")
                  # Eger kod kolonu bulunamadiysa, index kullan
                  if not tefas_set:
                      print(f"Kolonlar: {list(df.columns)}")
                      # Ilk kolonu kod kabul et
                      tefas_set = set([str(x).strip().upper() for x in df.iloc[:,0].dropna().tolist()])
              
                  results = {}
                  for kod in kodlar:
                      if kod.upper() in tefas_set:
                          results[kod] = "Evet"
                      else:
                          results[kod] = "Hayir"
              except Exception as e:
                  print(f"pytefas hata: {e}")
                  import traceback
                  traceback.print_exc()
                  results = {k: "HATA" for k in kodlar}

              ws.cell(5, 7).value = "Platform Durumu"
              for r in range(START_ROW, END_ROW+1):
                  kod = ws.cell(r, 1).value
                  if kod and str(kod).strip().upper() in [k.upper() for k in results.keys()]:
                      # exact match
                      orig = str(kod).strip()
                      # results key may be upper
                      for rk, rv in results.items():
                          if rk.upper() == orig.upper():
                              ws.cell(r, 7).value = rv
                              break
              
              wb.save(OUTPUT_FILE)
              print("Bitti")

          if __name__ == "__main__":
              main()
          PYEOF

      - name: Kutuphaneleri kur
        run: |
          pip install openpyxl pytefas pandas

      - name: Calistir
        run: python checker.py

      - name: Sonucu yukle
        uses: actions/upload-artifact@v4
        with:
          name: sonuc
          path: TefasControl_Sonuc_FINAL.xlsx
