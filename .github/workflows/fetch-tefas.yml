name: TEFAS Gunluk Pipeline

on:
  workflow_dispatch:   # "Run workflow" butonuyla elle tetikleme
  schedule:
    - cron: '35 7 * * 1-5'   # Hafta ici, TR saatiyle ~10:35 (UTC 07:35)

concurrency:
  group: tefas-gunluk-pipeline
  cancel-in-progress: false

jobs:
  gunluk-calistir:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt

      - name: Gunluk pipeline'i calistir
        run: python gunluk_pipeline.py

      - name: Degisen dosyalari GitHub'a geri yaz
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Otomatik gunluk guncelleme"
          file_pattern: "docs/data.json price_history.json onceki_rank.json"
