name: TEFAS Gunluk Pipeline

on:
  workflow_dispatch:   # "Run workflow" butonuyla elle tetikleme
  schedule:
    - cron: '30 7 * * 1-5'   # Hafta ici, TR saatiyle ~10:30 (UTC 07:30)

concurrency:
  group: tefas-gunluk-pipeline
  cancel-in-progress: false

jobs:
  gunluk-calistir:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Manuel tetik izni kontrolu
        id: kontrol
        run: |
          # ayarlar.json'da "manuel_guncelleme": false ise ELLE tetiklenen
          # (workflow_dispatch) calismalar hicbir sey yapmadan biter.
          # Zamanlanmis (cron 10:30) calisma her zaman calisir.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && grep -Eq '"manuel_guncelleme"[[:space:]]*:[[:space:]]*false' ayarlar.json 2>/dev/null; then
            echo "Manuel guncelleme KAPALI -- bu elle tetikleme atlandi."
            echo "calistir=false" >> "$GITHUB_OUTPUT"
          else
            echo "calistir=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Python kur
        if: steps.kontrol.outputs.calistir == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kutuphaneleri kur
        if: steps.kontrol.outputs.calistir == 'true'
        run: pip install -r requirements.txt

      - name: Gunluk pipeline'i calistir
        if: steps.kontrol.outputs.calistir == 'true'
        env:
          PYTHONUNBUFFERED: "1"   # ciktiyi tamponlamadan aninda akit -- uzun surebilecek
                                   # adimlarda (ornegin yeni fon gecmisi cekme) canli log
                                   # takibi icin gerekli
        run: python gunluk_pipeline.py

      - name: Google Drive'a yedek al
        if: steps.kontrol.outputs.calistir == 'true'
        continue-on-error: true
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          GAS_SECRET_TOKEN: ${{ secrets.GAS_SECRET_TOKEN }}
        run: python drive_yedek.py

      - name: Degisen dosyalari GitHub'a geri yaz
        if: always() && steps.kontrol.outputs.calistir == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Otomatik gunluk guncelleme"
          file_pattern: "docs/data.json price_history.json onceki_rank.json fon_kazanc.json portfoy.json bekleyen_emirler.json bekleyen_valorler.json fon_listesi.json eklenecek_fonlar.json eksik_gun_doldur.json eksik_gun_manuel.xlsx sabitler.json"
