name: TEFAS Gunluk Pipeline

on:
  workflow_dispatch:   # "Run workflow" butonuyla elle tetikleme
  repository_dispatch: # Dis zamanlayici (cron-job.org) tam saatinde tetikler
    types: [tefas-guncelle]
  schedule:
    # Hafta ici, TR saatiyle 10:30 / 11:00 / 11:30 (UTC 07:30 / 08:00 / 08:30).
    # Eksik fiyat varsa 1. ve 2. deneme bekler, 3. deneme eksik olsa da bitirir.
    # NOT: gunluk_pipeline.py bu uc cron dizesini tetik olarak tanir -- degistirirsen
    # oradaki deneme haritasini da guncelle.
    - cron: '30 7 * * 1-5'
    - cron: '0 8 * * 1-5'
    - cron: '30 8 * * 1-5'

concurrency:
  group: tefas-gunluk-pipeline
  cancel-in-progress: false

jobs:
  gunluk-calistir:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Manuel tetik izni kontrolu
        id: kontrol
        run: |
          # ayarlar.json'da "manuel_guncelleme": false ise ELLE tetiklenen
          # (workflow_dispatch) calismalar hicbir sey yapmadan biter.
          # Zamanlanmis (cron 10:30) calisma her zaman calisir.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && grep -Eq '"manuel_guncelleme"[[:space:]]*:[[:space:]]*false' ayarlar.json 2>/dev/null; then
            echo "Manuel guncelleme KAPALI -- bu elle tetikleme atlandi."
            echo "calistir=false" >> "$GITHUB_OUTPUT"
          else
            echo "calistir=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Python kur
        if: steps.kontrol.outputs.calistir == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kutuphaneleri kur
        if: steps.kontrol.outputs.calistir == 'true'
        run: pip install -r requirements.txt

      - name: Gunluk pipeline'i calistir
        if: steps.kontrol.outputs.calistir == 'true'
        env:
          TETIK_ZAMANI: ${{ github.event.schedule || (github.event_name == 'repository_dispatch' && 'dis-zamanlayici') || '' }}   # bos = elle tetikleme
          DENEME_NO: ${{ github.event.client_payload.deneme }}   # dis zamanlayicidan gelen deneme numarasi (1/2/3)
          PYTHONUNBUFFERED: "1"   # ciktiyi tamponlamadan aninda akit -- uzun surebilecek
                                   # adimlarda (ornegin yeni fon gecmisi cekme) canli log
                                   # takibi icin gerekli
        run: python gunluk_pipeline.py

      - name: Google Drive'a yedek al
        if: steps.kontrol.outputs.calistir == 'true'
        continue-on-error: true
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          GAS_SECRET_TOKEN: ${{ secrets.GAS_SECRET_TOKEN }}
        run: python drive_yedek.py

      - name: Degisen dosyalari GitHub'a geri yaz
        if: always() && steps.kontrol.outputs.calistir == 'true'
        run: |
          # Calisma sirasinda repoya baska bir commit girmis olabilir (siteden yazma,
          # elle dosya yukleme). Bu yuzden once commit atilir, sonra "pull --rebase"
          # ile guncel hal alinip push denenir; reddedilirse 5 kereye kadar tekrarlanir.
          # Listedeki dosyalardan biri repoda yoksa atlanir (eskiden tum commit coküyordu).
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in docs/data.json durum.json price_history.json onceki_rank.json fon_kazanc.json portfoy.json bekleyen_emirler.json bekleyen_valorler.json fon_listesi.json eklenecek_fonlar.json eksik_gun_doldur.json eksik_gun_manuel.xlsx sabitler.json; do
            if [ -e "$f" ]; then git add "$f"; else echo "Atlandi (dosya yok): $f"; fi
          done

          if git diff --cached --quiet; then
            echo "Kaydedilecek degisiklik yok."
            exit 0
          fi

          git commit -m "Otomatik gunluk guncelleme"

          for deneme in 1 2 3 4 5; do
            # -X theirs (rebase'te): cakisma olursa bu pipeline'in urettigi dosya kazanir
            if git pull --rebase -X theirs origin main && git push origin main; then
              echo "Push basarili (deneme $deneme)."
              exit 0
            fi
            echo "Push basarisiz (deneme $deneme), tekrar denenecek..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "5 denemede de push yapilamadi."
          exit 1
