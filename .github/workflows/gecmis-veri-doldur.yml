name: Gecmis Veri Doldur (tek seferlik)

on:
  workflow_dispatch: {}

jobs:
  doldur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Gecmis veriyi cek ve price_history.json'u guncelle
        run: python fetch_gecmis_veri.py

      - name: Degisikligi commit'le
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Gecmis veri dolduruldu (fetch_gecmis_veri.py)"
          file_pattern: price_history.json
