name: Gecmis Veri Doldur (Olcek Duzeltmeli)

on:
  workflow_dispatch:
    inputs:
      yil:
        description: "Toplam hedef gecmis (yil)"
        default: "4.9"
      girdi:
        description: "Girdi dosyasi"
        default: "price_history_temiz.json"
      olcek_duzelt:
        description: "Olcek duzeltmesi acik mi?"
        default: "true"

permissions:
  contents: write

jobs:
  doldur:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari kur
        run: |
          pip install -r requirements.txt
          pip install pytefas

      - name: Klasor kontrol
        run: |
          ls -lh de_walkforward_test/

      - name: Gecmis veriyi cek (OLCEK DUZELTME ACIK)
        working-directory: de_walkforward_test
        run: |
          echo "Girdi: ${{ inputs.girdi }}, Yil: ${{ inputs.yil }}"
          python fetch_gecmis_veri.py --yil "${{ inputs.yil }}" --girdi "${{ inputs.girdi }}" --cikti price_history_6y.json --olcek-duzelt

      - name: Log ve olcek kontrol
        if: always()
        working-directory: de_walkforward_test
        run: |
          echo "=== OLCEK? satirlari ==="
          grep -n "OLCEK" fetch_*.log 2>/dev/null || grep -n "OLCEK" *.log 2>/dev/null || echo "Log'da OLCEK yok"
          ls -lh *.json *.log 2>/dev/null | head -n 20

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f de_walkforward_test/price_history_6y.json de_walkforward_test/gecmis_cache.json de_walkforward_test/*.log 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Gecmis veri 6y OLCEK DUZELTME ile $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git push)
