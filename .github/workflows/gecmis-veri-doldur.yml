name: Gecmis Veri Doldur (tek seferlik)

on:
  workflow_dispatch:
    inputs:
      yil:
        description: "Toplam hedef gecmis (yil)"
        default: "6"
      girdi:
        description: "Girdi dosyasi"
        default: "price_history_temiz.json"

permissions:
  contents: write

jobs:
  doldur:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Klasorleri kontrol et
        run: |
          pwd
          ls -lh
          ls -lh de_walkforward_test/

      - name: Gecmis veriyi cek
        working-directory: de_walkforward_test
        run: python fetch_gecmis_veri.py --yil "${{ inputs.yil }}" --girdi "${{ inputs.girdi }}" --cikti price_history_6y.json

      - name: Degisikligi commit'le
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Gecmis veri (fetch_gecmis_veri.py) - ${{ inputs.yil }}yil"
          file_pattern: de_walkforward_test/price_history_6y.json de_walkforward_test/gecmis_cache.json
