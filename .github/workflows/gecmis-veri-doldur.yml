name: Gecmis Veri Doldur

on:
  workflow_dispatch:
    inputs:
      yil:
        description: "Toplam hedef gecmis (yil) - TEFAS max 5"
        default: "4.9"
      girdi:
        description: "Girdi dosyasi"
        default: "price_history_temiz.json"

permissions:
  contents: write

jobs:
  doldur:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bagimliliklari kur
        run: |
          pip install -r requirements.txt
          pip install pytefas
      - name: Klasor kontrol
        run: |
          ls -lh de_walkforward_test/
      - name: Gecmis veriyi cek
        working-directory: de_walkforward_test
        run: python fetch_gecmis_veri.py --yil "${{ inputs.yil }}" --girdi "${{ inputs.girdi }}" --cikti price_history_6y.json
      - name: Cache ve ciktiyi commit'le
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f de_walkforward_test/gecmis_cache.json 2>/dev/null || true
          git add -f de_walkforward_test/price_history_6y.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Gecmis veri - ${{ inputs.yil }}yil" && git push)
