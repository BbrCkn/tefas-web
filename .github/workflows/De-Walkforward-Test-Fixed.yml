name: DE Walk-Forward Test (6y)

on:
  workflow_dispatch:
    inputs:
      girdi:
        description: "Girdi dosyasi (6y)"
        default: "price_history_6y.json"

permissions:
  contents: write

jobs:
  walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari kur
        run: |
          pip install -r requirements.txt
          pip install pandas numpy

      - name: Backtest klasor kontrol
        run: |
          ls -lh de_walkforward_test/
          ls -lh de_walkforward_test/*.json | head -n 20

      - name: Walk-forward backtest kos (6y)
        working-directory: de_walkforward_test
        run: |
          python backtest_6y_walkforward.py --girdi "${{ inputs.girdi }}" || python backtest_6y_walkforward.py

      - name: Sonuclari listele
        if: always()
        run: |
          ls -lh de_walkforward_test/results/ || echo "results yok"
          cat de_walkforward_test/results/walkforward_summary.csv || true

      - name: Sonuclari commit'le
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f de_walkforward_test/results/ 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Walk-forward 6y results $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git push)
